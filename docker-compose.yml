services:
  spindle:
    build:
      context: .
      args:
        MKV_VERSION: ${MKV_VERSION:-latest}
        ACCEPT_EULA: ${ACCEPT_EULA:-no}
    image: spindle
    container_name: spindle
    restart: unless-stopped
    ports:
      - "${PORT:-8780}:8780"
    user: "${PUID:-1000}:${PGID:-1000}"
    group_add: ["${CDROM_GID:-24}", "${RENDER_GID:-105}"]   # cdrom; render (hardware encoding via /dev/dri, if present)
    environment:
      TZ: ${TZ:-Europe/Berlin}
      INSTANCE_NAME: ${INSTANCE_NAME:-spindle}
      PEERS: ${PEERS:-}
      HIDE_DRIVES: ${HIDE_DRIVES-cdemu|virtual|qemu|vbox}
      OUTPUT_MOUNT: ${NAS_MOUNT:-/mnt/nas}
      AUTH_USER: ${AUTH_USER:-}
      AUTH_PASS: ${AUTH_PASS:-}
      OUTPUT_DIR: ${OUTPUT_DIR:-/mnt/nas/rips}
    volumes:
      - /dev:/dev                                   # the drive may be re-plugged at any time
      - ./data:/data
      - ${STAGING_PATH:-./data/staging}:/data/staging   # staging buffer (best on a large local disk)
      - ${NAS_MOUNT:-/mnt/nas}:${NAS_MOUNT:-/mnt/nas}:rslave
    device_cgroup_rules:
      - "b 11:* rmw"                                # /dev/sr*
      - "c 21:* rmw"                                # /dev/sg*
      - "c 226:* rmw"                               # /dev/dri (graphics hardware for hardware encoding, if present)
