# Add-on for machines with an NVIDIA card: passes the card into the container via CDI (NVENC for conversion).
# install.sh includes this file automatically (COMPOSE_FILE in .env) if Docker knows the card as the CDI device nvidia.com/gpu=all
# (NVIDIA Container Toolkit; its nvidia-cdi-refresh service writes the description to /var/run/cdi or /etc/cdi).
# To turn it off: NVIDIA=no in .env, then ./install.sh.
services:
  spindle:
    devices:
      - nvidia.com/gpu=all
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
