name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: ffmpeg installieren (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: ffmpeg installieren (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Abhängigkeiten
        run: python -m pip install fastapi
      - name: Skripte prüfen (Syntax)
        run: |
          for f in install.sh scripts/*.sh; do bash -n "$f"; done
      - name: Unittests
        run: python -m unittest discover -s tests -t . -v

  docker:
    name: Dockerfile (Lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose-Dateien prüfen
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.nvidia.yml config -q
